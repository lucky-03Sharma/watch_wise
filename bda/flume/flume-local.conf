# ==============================================================================
# Apache Flume Configuration: Standalone Local Mode (No Hadoop required)
# ==============================================================================
# Sinks events to a local file roll sink and console logger for verification.
# ==============================================================================

local_agent.sources = r1
local_agent.channels = c1
local_agent.sinks = k1

# Exec source watching user_activity.log
local_agent.sources.r1.type = exec
local_agent.sources.r1.command = tail -F bda/logs/flume_source/user_activity.log
local_agent.sources.r1.restart = true

# Memory Channel
local_agent.channels.c1.type = memory
local_agent.channels.c1.capacity = 5000
local_agent.channels.c1.transactionCapacity = 500

# File Roll Sink (Simulating HDFS storage locally)
local_agent.sinks.k1.type = file_roll
local_agent.sinks.k1.sink.directory = bda/data/hdfs/clickstream/local_archive
local_agent.sinks.k1.sink.rollInterval = 30

# Bindings
local_agent.sources.r1.channels = c1
local_agent.sinks.k1.channel = c1
