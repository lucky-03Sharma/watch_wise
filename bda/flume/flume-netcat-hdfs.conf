# ==============================================================================
# Apache Flume Configuration: Netcat TCP Socket Source to Hadoop HDFS
# ==============================================================================
# Ingests real-time events sent directly over TCP from WatchWise on port 44444
# ==============================================================================

watchwise_netcat_agent.sources = r1
watchwise_netcat_agent.channels = c1
watchwise_netcat_agent.sinks = k1

# Netcat TCP Source
watchwise_netcat_agent.sources.r1.type = netcat
watchwise_netcat_agent.sources.r1.bind = 0.0.0.0
watchwise_netcat_agent.sources.r1.port = 44444
watchwise_netcat_agent.sources.r1.max-line-length = 8192

# Timestamp Interceptor
watchwise_netcat_agent.sources.r1.interceptors = i1
watchwise_netcat_agent.sources.r1.interceptors.i1.type = timestamp

# Memory Channel
watchwise_netcat_agent.channels.c1.type = memory
watchwise_netcat_agent.channels.c1.capacity = 10000
watchwise_netcat_agent.channels.c1.transactionCapacity = 1000

# HDFS Sink
watchwise_netcat_agent.sinks.k1.type = hdfs
watchwise_netcat_agent.sinks.k1.hdfs.path = hdfs://localhost:9000/watchwise/clickstream/%Y-%m-%d/
watchwise_netcat_agent.sinks.k1.hdfs.filePrefix = netcat-
watchwise_netcat_agent.sinks.k1.hdfs.fileSuffix = .log
watchwise_netcat_agent.sinks.k1.hdfs.fileType = DataStream
watchwise_netcat_agent.sinks.k1.hdfs.writeFormat = Text
watchwise_netcat_agent.sinks.k1.hdfs.rollInterval = 30
watchwise_netcat_agent.sinks.k1.hdfs.rollSize = 1048576
watchwise_netcat_agent.sinks.k1.hdfs.rollCount = 50
watchwise_netcat_agent.sinks.k1.hdfs.batchSize = 25
watchwise_netcat_agent.sinks.k1.hdfs.useLocalTimeStamp = true

# Bindings
watchwise_netcat_agent.sources.r1.channels = c1
watchwise_netcat_agent.sinks.k1.channel = c1
